name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias de runtime
        run: npm audit --omit=dev --audit-level=high

      - name: Testes
        run: npm test

      - name: Build de producao
        run: npm run build
